name: SDK quality

"on":
  pull_request:
    branches: [dev, debug, main]
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    if: ${{ github.event_name == 'pull_request' }}
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  full:
    if: ${{ github.event_name != 'pull_request' }}
    name: Scheduled/manual quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run full quality checks
        env:
          GOMAXPROCS: 2
          GOFLAGS: -p=2
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test -- --maxWorkers=1 --no-file-parallelism
          pnpm build:all
          pnpm size
          (cd go && go test -p 2 ./...)
