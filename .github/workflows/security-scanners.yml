name: SDK security scanners

"on":
  schedule:
    - cron: "37 8 * * 0"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Exact reviewed release tag to scan when called by publication.
        required: false
        type: string
        default: ""
      release_sha:
        description: Exact commit SHA expected for release_tag when called by publication.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sdk-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanners:
    name: Source security scanners
    runs-on: [self-hosted, arcpay-security-scan]
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release source when called by publication
        if: ${{ inputs.release_tag != '' || inputs.release_sha != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^go/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n1 "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"

      - name: Prepare scanner bin directory
        run: mkdir -p "$RUNNER_TEMP/security-bin"

      - name: Install Gitleaks 8.30.1 with checksum verification
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_sha256" = "$GITLEAKS_SHA256"
          tar -xzf "$archive" -C "$RUNNER_TEMP/security-bin" gitleaks
          "$RUNNER_TEMP/security-bin/gitleaks" version

      - name: Scan source history for secrets
        run: |
          "$RUNNER_TEMP/security-bin/gitleaks" detect \
            --redact \
            --no-banner \
            --exit-code 1 \
            --source .

      - name: Pin Semgrep Community rules
        run: |
          git init "$RUNNER_TEMP/semgrep-rules"
          git -C "$RUNNER_TEMP/semgrep-rules" remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C "$RUNNER_TEMP/semgrep-rules" fetch --depth 1 origin 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          git -C "$RUNNER_TEMP/semgrep-rules" checkout --detach 16b9e6d45f10649f6a531ec4838ed9924372c3bc

      - name: Run Semgrep CE with pinned community rules
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/semgrep-rules:/rules:ro" \
            -w /src \
            semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan \
              --config /rules/typescript/lang/security \
              --config /rules/typescript/react/security \
              --config /rules/go/lang/security \
              --metrics=off \
              --error

      - name: Install OSV-Scanner 2.7.0 with checksum verification
        env:
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          binary="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$binary"
          actual_sha256="$(sha256sum "$binary" | awk '{print $1}')"
          test "$actual_sha256" = "$OSV_SHA256"
          chmod 0755 "$binary"
          "$binary" --version

      - name: Scan Go and pnpm dependency manifests
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source -r . \
            --format json --output "$RUNNER_TEMP/osv.json"
