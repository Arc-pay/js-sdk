name: Publish SDK to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.action == 'published' }}
    runs-on: ubuntu-latest
    environment: sdk-npm-release
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          case "$tag" in
            go/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must use go/vSEMVER: $tag" >&2; exit 1 ;;
          esac
          version="${tag#go/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must contain stable semver: $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed main ancestry
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify committed release version
        run: node scripts/prepare-release-version.mjs --version "${{ steps.release.outputs.version }}"

      - name: Build and verify SDK
        env:
          GOMAXPROCS: 2
          GOFLAGS: -p=2
        run: |
          pnpm typecheck
          pnpm test -- --maxWorkers=1 --no-file-parallelism
          pnpm build:all
          pnpm size

      - name: Go tests
        env:
          GOMAXPROCS: 2
          GOFLAGS: -p=2
        run: go test -p 2 ./...
        working-directory: go

      - name: Pack release artifact
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n1)"
          test -f "$RUNNER_TEMP/$tarball"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish the verified tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --ignore-scripts
