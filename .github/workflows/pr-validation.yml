name: SDK PR validation

on:
  pull_request:
    branches: [dev, debug, main]

permissions:
  contents: read

concurrency:
  group: sdk-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate package and module metadata
        run: |
          set -euo pipefail
          test -f package.json
          test -f pnpm-lock.yaml
          test -f go/go.mod
          test -f go/go.sum
          node -e "const p=require('./package.json'); if (!p.name || !p.version || !p.packageManager) process.exit(1)"
